  <text x="200" y="180" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#00d4ff" text-anchor="middle">MODULATING • STAGE 2</text>
  <text x="200" y="198" font-family="system-ui, sans-serif" font-size="10" fill="#94a3b8" text-anchor="middle">BEST COMFORT ARCTICPRO</text>

  <line x1="70" y1="245" x2="330" y2="245" stroke="#475569" stroke-width="3"/>
