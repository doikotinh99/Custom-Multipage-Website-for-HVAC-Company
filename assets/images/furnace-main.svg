  <rect x="145" y="405" width="110" height="20" rx="4" fill="#ff2a85"/>
  <text x="200" y="419" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">CHICAGO TESTED</text>
