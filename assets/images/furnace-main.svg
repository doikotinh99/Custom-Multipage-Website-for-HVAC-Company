    <rect x="105" y="300" width="190" height="8" rx="4"/>
    <rect x="105" y="320" width="190" height="8" rx="4"/>
    <rect x="105" y="340" width="190" height="8" rx="4"/>
    <rect x="105" y="360" width="190" height="8" rx="4"/>
    <rect x="105" y="380" width="190" height="8" rx="4"/>
