      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <ellipse cx="200" cy="460" rx="140" ry="14" fill="#000000" opacity="0.5"/>

  <rect x="70" y="30" width="260" height="420" rx="14" fill="url(#furnaceBody)" stroke="#334155" stroke-width="3"/>
  <rect x="74" y="34" width="252" height="412" rx="10" fill="none" stroke="url(#salmonGlow)" stroke-width="1.5" opacity="0.6"/>

  <rect x="85" y="45" width="230" height="190" rx="8" fill="#14213d" stroke="#334155" stroke-width="1.5"/>

  <rect x="130" y="65" width="140" height="45" rx="6" fill="#090d16" stroke="#475569" stroke-width="1.5"/>
  <circle cx="150" cy="87" r="10" fill="#ff6550" filter="url(#neonGlow)"/>
  <circle cx="150" cy="87" r="5" fill="#ffd166"/>
  <circle cx="180" cy="87" r="10" fill="#00d4ff" filter="url(#neonGlow)"/>
  <circle cx="180" cy="87" r="5" fill="#ffffff"/>
  <circle cx="210" cy="87" r="10" fill="#00d4ff" filter="url(#neonGlow)"/>
  <circle cx="210" cy="87" r="5" fill="#ffffff"/>
  <circle cx="240" cy="87" r="10" fill="#ff6550" filter="url(#neonGlow)"/>
  <circle cx="240" cy="87" r="5" fill="#ffd166"/>

