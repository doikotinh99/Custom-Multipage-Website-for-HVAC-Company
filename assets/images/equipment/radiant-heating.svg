<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <ellipse cx="160" cy="265" rx="120" ry="12" fill="#000" opacity="0.5"/>
  <!-- Floor cross-section -->
  <rect x="40" y="180" width="240" height="75" rx="6" fill="#1e293b" stroke="#475569" stroke-width="2"/>
  <line x1="40" y1="195" x2="280" y2="195" stroke="#f59e0b" stroke-width="2"/>
  <!-- Looping PEX heating pipes embedded in floor -->
  <g stroke="#ef4444" stroke-width="8" stroke-linecap="round" fill="none">
    <path d="M 60 210 Q 80 230 100 210 Q 120 190 140 210 Q 160 230 180 210 Q 200 190 220 210 Q 240 230 260 210"/>
  </g>
  <!-- Stainless Steel Manifold Above -->
  <rect x="90" y="45" width="140" height="18" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <rect x="90" y="95" width="140" height="18" rx="4" fill="#94a3b8" stroke="#cbd5e1" stroke-width="1.5"/>
  <!-- Flow Meter Valves -->
  <g fill="#ef4444">
    <rect x="110" y="63" width="8" height="32"/><rect x="140" y="63" width="8" height="32"/>
    <rect x="170" y="63" width="8" height="32"/><rect x="200" y="63" width="8" height="32"/>
  </g>
  <!-- Red Heat Radiating Waves -->
  <path d="M 90 170 Q 100 155 110 170" stroke="#ff6550" stroke-width="2.5" fill="none"/>
  <path d="M 150 170 Q 160 155 170 170" stroke="#ff6550" stroke-width="2.5" fill="none"/>
  <path d="M 210 170 Q 220 155 230 170" stroke="#ff6550" stroke-width="2.5" fill="none"/>
</svg>