<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <linearGradient id="bldG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/><stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <ellipse cx="160" cy="265" rx="100" ry="12" fill="#000" opacity="0.5"/>
  <rect x="75" y="35" width="170" height="220" rx="12" fill="url(#bldG)" stroke="#00d4ff" stroke-width="2"/>
  <!-- Digital Hydronic Display -->
  <rect x="105" y="60" width="110" height="50" rx="6" fill="#050c1f" stroke="#00d4ff" stroke-width="1"/>
  <text x="160" y="88" font-family="system-ui, sans-serif" font-size="18" font-weight="900" fill="#34d399" text-anchor="middle">180°F</text>
  <text x="160" y="102" font-family="system-ui, sans-serif" font-size="8" font-weight="bold" fill="#00d4ff" text-anchor="middle">MODULATING HYDRONIC</text>
  <!-- Pressure Gauge -->
  <circle cx="125" cy="150" r="18" fill="#0f172a" stroke="#f59e0b" stroke-width="2"/>
  <line x1="125" y1="150" x2="135" y2="140" stroke="#ff6550" stroke-width="2"/>
  <!-- Circulator Pump -->
  <circle cx="185" cy="150" r="20" fill="#ff6550" stroke="#b91c1c" stroke-width="2"/>
  <circle cx="185" cy="150" r="8" fill="#1e293b"/>
  <!-- Pipes -->
  <rect x="105" y="215" width="18" height="40" fill="#d97706"/>
  <rect x="195" y="215" width="18" height="40" fill="#0284c7"/>
</svg>