<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 280" width="100%" height="100%">
  <defs>
    <radialGradient id="ringG" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#000"/><stop offset="100%" stop-color="#00d4ff"/>
    </radialGradient>
  </defs>
  <ellipse cx="160" cy="260" rx="90" ry="12" fill="#000" opacity="0.4"/>
  <!-- Circular Bezel -->
  <circle cx="160" cy="140" r="105" fill="#1e293b" stroke="#475569" stroke-width="4"/>
  <circle cx="160" cy="140" r="95" fill="#040814" stroke="#00d4ff" stroke-width="2"/>
  <!-- Glowing Heat/Cool Ring -->
  <circle cx="160" cy="140" r="82" fill="none" stroke="#ff6550" stroke-width="5" stroke-dasharray="240 120"/>
  <!-- Digital Temperature -->
  <text x="160" y="152" font-family="system-ui, sans-serif" font-size="44" font-weight="900" fill="#ffffff" text-anchor="middle">72°</text>
  <text x="160" y="174" font-family="system-ui, sans-serif" font-size="10" font-weight="bold" fill="#00d4ff" text-anchor="middle">SET TO 72° • WI-FI ECO</text>
  <text x="160" y="105" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#34d399" text-anchor="middle">HEATING • 45% HUM</text>
</svg>